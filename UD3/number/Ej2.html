<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    <script>
        const num1 = 1357;
        const num2 = 135.7;
        const num3 = 135e7; // 135 * 10^7
        const num4 = 0o1357;
        const num5 = 0x1357;

        alert("Numero entero: " + num1);
        alert("Número decimal: " + num2);
        alert("Número en notación científica: " + num3);
        alert("Número octal: " + num4);
        alert("Número hexadecimal: " + num5);
    </script>
</body>
</html>
