<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11</title>
</head>
<body>
    <script>
        let patron = "";

        // bucle exterior -> número de filas
        // bucle interior -> columnas
        for (let i = 1; i <= 13; i++) {
            for (let j = 1; j <= i; j++) {
                patron += "*";
            }

            patron += "\n";
        }

        console.log(patron);
    </script>
    <h2>Ejecución finalizada (consola)</h2>
</body>
</html>
