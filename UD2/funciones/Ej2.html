<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    <script>
        // Forma normal
        function cubo(n) {
            return n ** 3;
        }

        console.log(cubo(4));

        // Arrow function
        let cuboArrow = n => n ** 3;
        console.log("Arrow function: " + cuboArrow(4));
    </script>
</body>
</html>
