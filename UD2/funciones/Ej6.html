<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>
<body>
    <script>
        let radio = parseFloat(prompt("Introduce el radio del círculo"));

        function areaC(r) {
            return Math.PI * r ** 2;
        }

        function perimetroC(r) {
            return 2 * Math.PI * r;
        }

        alert("Area: " + Math.round(areaC(radio) * 100) / 100 + "  Perímetro: " + Math.round(perimetroC(radio) * 100) / 100);
    </script>
</body>
</html>
