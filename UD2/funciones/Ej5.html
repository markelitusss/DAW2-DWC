    <script>
        let pasaraFarenheit = (grado) => {return Fahrenheit = grado * 1.8 + 32;};
        let pasaraCelsius = (grado) => {return Celsius = Math.round((grado - 32) * 5 / 9);};

        console.log(pasaraCelsius(100));
        console.log(pasaraFarenheit(25));

    </script>
